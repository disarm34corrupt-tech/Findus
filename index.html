<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Where Your Eyes Find Me</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =================================================
         INTRO
    ================================================== -->

    <section
        id="intro"
        class="intro"
    >

        <div class="intro-content">

            <p class="eyebrow">
                A LITTLE GAME FOR YOU
            </p>

            <h1>
                Where Your<br>
                <i>Eyes Find Me</i>
            </h1>

            <p class="intro-text">
                Find the people hiding in pairs.<br>
                Open two cards and find their match.
            </p>

            <button
                id="startButton"
                class="main-button"
                type="button"
            >
                START GAME
            </button>

        </div>

    </section>


    <!-- =================================================
         GAME
    ================================================== -->

    <main
        id="game"
        class="game hidden"
    >

        <header class="game-header">

            <div>

                <p class="eyebrow">
                    WHERE YOUR EYES FIND ME
                </p>

                <h2>
                    Find the pairs.
                </h2>

            </div>


            <div class="stats">

                <div>
                    <span>PAIRS</span>
                    <strong id="pairCount">0</strong>
                    <small>/ 18</small>
                </div>

                <div>
                    <span>MOVES</span>
                    <strong id="moveCount">0</strong>
                </div>

            </div>

        </header>


        <!-- CARD BOARD -->

        <section
            id="gameBoard"
            class="game-board"
        ></section>

    </main>


    <!-- =================================================
         MATCH POPUP
    ================================================== -->

    <div
        id="matchPopup"
        class="popup hidden"
    >

        <div class="popup-box">

            <p class="popup-label">
                MATCH ♡
            </p>

            <h2 id="matchName">
                Arum
            </h2>

            <p id="matchMessage">
                You found a pair!
            </p>

            <button
                id="continueButton"
                class="main-button dark-button"
                type="button"
            >
                CONTINUE
            </button>

        </div>

    </div>


    <!-- =================================================
         COMPLETE POPUP
    ================================================== -->

    <div
        id="completePopup"
        class="popup hidden"
    >

        <div class="popup-box">

            <p class="popup-label">
                18 / 18 PAIRS
            </p>

            <h2>
                You found them all. ♡
            </h2>

            <p>
                There's something waiting for you.
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
