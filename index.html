<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Where Your Eyes Find Me</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    color: #f5f1e8;
    background: #111;
}


/* =====================================================
   HIDDEN
===================================================== */

.hidden {
    display: none !important;
}


/* =====================================================
   INTRO
===================================================== */

#intro {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;

    background:
        linear-gradient(
            rgba(15,15,15,.45),
            rgba(15,15,15,.7)
        ),
        url("Background.jpg");

    background-size: cover;
    background-position: center;
}


.intro-content {
    max-width: 700px;
}


.eyebrow {
    font-family: Arial, Helvetica, sans-serif;

    font-size: 10px;

    letter-spacing: .25em;

    opacity: .65;

    margin-bottom: 18px;
}


h1 {
    font-size: clamp(48px, 9vw, 88px);

    font-weight: 400;

    line-height: .95;

    margin-bottom: 28px;
}


h1 i {
    font-weight: 400;
}


.intro-text {
    font-family: Arial, Helvetica, sans-serif;

    font-size: 14px;

    line-height: 1.7;

    opacity: .75;

    margin-bottom: 35px;
}


/* =====================================================
   BUTTON
===================================================== */

button {
    font-family: Arial, Helvetica, sans-serif;
}


.start-button,
.continue-button {

    border: 1px solid rgba(245,241,232,.6);

    background: rgba(255,255,255,.08);

    color: #f5f1e8;

    padding: 15px 25px;

    font-size: 10px;

    letter-spacing: .2em;

    cursor: pointer;

    transition: .2s ease;
}


.start-button:hover,
.continue-button:hover {

    background: #f5f1e8;

    color: #111;
}


/* =====================================================
   GAME
===================================================== */

#game {

    min-height: 100vh;

    padding: 25px 30px 45px;

    background:
        linear-gradient(
            rgba(10,10,10,.25),
            rgba(10,10,10,.55)
        ),
        url("Background.jpg");

    background-size: cover;

    background-position: center;
}


/* =====================================================
   HEADER
===================================================== */

.game-header {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 20px;

    margin-bottom: 25px;
}


.game-header h2 {

    font-size: clamp(28px,4vw,44px);

    font-weight: 400;
}


.stats {

    display: flex;

    gap: 20px;

    font-family: Arial, Helvetica, sans-serif;

    text-align: right;
}


.stats div {

    display: flex;

    align-items: baseline;

    gap: 4px;
}


.stats span {

    font-size: 9px;

    letter-spacing: .15em;

    opacity: .6;
}


.stats strong {

    font-size: 22px;
}


.stats small {

    font-size: 10px;

    opacity: .6;
}


/* =====================================================
   BOARD
===================================================== */

#gameBoard {

    width: min(100%, 1000px);

    margin: auto;

    display: grid;

    grid-template-columns: repeat(6, 1fr);

    gap: 10px;
}


/* =====================================================
   CARD
===================================================== */

.memory-card {

    position: relative;

    width: 100%;

    aspect-ratio: 1 / 1.2;

    border: none;

    background: transparent;

    cursor: pointer;

    perspective: 800px;

    padding: 0;
}


.card-inner {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    transform-style: preserve-3d;

    transition: transform .45s ease;
}


.memory-card.flipped .card-inner {

    transform: rotateY(180deg);
}


.card-front,
.card-back {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    backface-visibility: hidden;

    -webkit-backface-visibility: hidden;

    border-radius: 6px;

    overflow: hidden;
}


/* BACK */

.card-back {

    display: flex;

    align-items: center;

    justify-content: center;

    background: #e9e3d7;

    color: #222;

    border: 1px solid rgba(0,0,0,.25);

    font-size: 28px;
}


.card-back span {
    opacity: .35;
}


/* FRONT */

.card-front {

    transform: rotateY(180deg);

    background: #f5f1e8;

    display: flex;

    align-items: center;

    justify-content: center;
}


.card-front img {

    width: 100%;

    height: 100%;

    object-fit: contain;
}


/* MATCHED */

.memory-card.matched {

    cursor: default;
}


.memory-card.matched .card-front {

    box-shadow:
        0 0 0 2px
        rgba(245,241,232,.8);
}


/* =====================================================
   POPUP
===================================================== */

.popup {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.72);

    backdrop-filter: blur(5px);
}


.popup-box {

    width: min(90%, 430px);

    padding: 45px 30px;

    text-align: center;

    background: #f5f1e8;

    color: #181818;
}


.popup-box .popup-label {

    font-family: Arial, Helvetica, sans-serif;

    font-size: 10px;

    letter-spacing: .2em;

    opacity: .5;

    margin-bottom: 15px;
}


.popup-box h2 {

    font-size: 32px;

    font-weight: 400;

    margin-bottom: 15px;
}


.popup-box p {

    font-family: Arial, Helvetica, sans-serif;

    font-size: 13px;

    line-height: 1.7;

    opacity: .7;
}


.continue-button {

    margin-top: 25px;

    background: #222;

    color: #f5f1e8;

    border-color: #222;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    #game {
        padding: 20px 15px 35px;
    }

    .game-header h2 {
        font-size: 27px;
    }

    .stats {
        flex-direction: column;
        gap: 5px;
        align-items: flex-end;
    }

    #gameBoard {
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
    }

}


@media (max-width: 420px) {

    #gameBoard {
        grid-template-columns: repeat(3, 1fr);
    }

}

</style>

</head>


<body>

<div

            You found them all. ♡
        </h2>

        <p>
            There's something waiting for you.
        </p>

    </div>

</div>
